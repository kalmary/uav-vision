[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-vision"
version = "0.1.0"
description = "Real-time UAV object detection"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24.4",
]

[project.scripts]
uav-vision = "uav_vision.entrypoints.main:main"
uav-vision-usb = "uav_vision.entrypoints.usb_camera:main"

[project.optional-dependencies]
desktop = [
    "opencv-python>=4.11.0.86",
    "ultralytics>=8.4.155",
]
headless = [
    "ultralytics-opencv-headless>=8.4.155",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
conflicts = [
    [
        { extra = "desktop" },
        { extra = "headless" },
    ],
]

[dependency-groups]
test = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "ruff>=0.16.8",
]
